plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'common/src/main/java', 'forge/src/main/java']
        }
        resources {
            srcDirs = [
                    'src/main/resources',
                    'common/src/main/resources',
                    'forge/src/main/resources',
                    'src/generated/resources'
            ]
            exclude 'architectury.common.json'
            exclude 'fabric.mod.json'
            exclude 'palladium.accesswidener'
            exclude 'META-INF/mods.toml'
            exclude 'data/c/**'
            exclude 'src/generated/**/.cache'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.threetag.net' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeModule 'com.github.rtyley', 'animated-gif-lib-for-java'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('common/src/main/resources').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Stage 1 only: use the released 1.20.1 API as a signature reference while
    // equivalent in-tree compatibility classes are introduced subsystem by subsystem.
    compileOnly files(
            'libs/stage1-reference/palladiumcore-common-1.0.1+1.20.1.jar',
            'libs/stage1-reference/palladiumcore-forge-1.0.1+1.20.1-forge.jar'
    )

    // The legacy common sources use Fabric's side annotations. They remain
    // compile-only during bootstrap and do not create a runtime Fabric dependency.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // KubeJS is Palladium's scripting API and is required by downstream addon
    // packs. Keep it optional for consumers while making it available in dev runs.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    compileOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    localRuntime "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '2000', '-Xmaxwarns', '200']
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
